name: bcc_chat
description: BCC Chat — a real-time messaging app built with Flutter, Firebase, BLoC and Clean Architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & architecture
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  fpdart: ^1.1.1
  rxdart: ^0.28.0
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.4.0

  # Calls
  agora_rtc_engine: ^6.5.1
  permission_handler: ^11.4.0

  # Media & files
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  record: ^6.0.0
  just_audio: ^0.10.2
  video_player: ^2.9.5
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # Location
  geolocator: ^14.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  emoji_picker_flutter: ^4.3.0

  # Utils
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_contacts: ^2.1.0
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  adaptive_icon_foreground_inset: 16
