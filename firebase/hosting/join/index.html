<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join group on BCC Chat</title>
  <style>
    :root { --blue:#3A9AD9; --bg:#F4F8FB; --text:#2B2B2D; --muted:#5A5A5C; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0E0F11; --text:#F2F4F7; --muted:#9A9EA6; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; box-sizing:border-box; }
    .card { max-width:380px; text-align:center; }
    h1 { font-size:22px; margin:16px 0 8px; }
    p { color:var(--muted); line-height:1.5; }
    a.btn { display:inline-block; margin-top:16px; padding:14px 22px; border-radius:14px; background:var(--blue);
            color:#fff; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're invited to a group on BCC Chat</h1>
    <p>Open this link on a phone with the BCC Chat app installed to join the group.</p>
    <a class="btn" id="open" href="#">Open in BCC Chat</a>
  </div>
  <script>
    // Hand the same path to the app (Android intent fallback).
    var path = location.pathname.replace(/^\//, '');
    document.getElementById('open').href =
      'intent://bccnew-53344.web.app/' + path + '#Intent;scheme=https;package=com.bccchat.ammar;end';
  </script>
</body>
</html>
